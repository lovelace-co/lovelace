name: windows-test-build

# One-off unsigned Windows installer for manual testing. Push the
# windows-test-build branch to run it; the NSIS .exe is attached to the
# windows-test prerelease, since release assets do not count against the
# Actions artifact storage quota. This is not a real release: no signing,
# no updater packages. Delete the branch and the windows-test prerelease
# when done.

on:
  push:
    branches:
      - windows-test-build

permissions:
  contents: write

jobs:
  build:
    name: build (windows-x86_64, unsigned)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Stage sidecars
        run: ./apps/desktop/scripts/prepare-sidecars.sh

      # Unsigned, NSIS only, and no updater artifacts so the build does
      # not require the updater signing key.
      - name: Build with Tauri
        run: >-
          pnpm --filter @lovelace/desktop exec tauri build
          --config '{"bundle":{"targets":["nsis"],"createUpdaterArtifacts":false}}'

      - name: Attach installer to the windows-test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXE=$(ls apps/desktop/src-tauri/target/release/bundle/nsis/*.exe)
          if ! gh release view windows-test > /dev/null 2>&1; then
            gh release create windows-test \
              --prerelease \
              --title "windows test build (unsigned)" \
              --notes "Unsigned Windows installer for manual testing, built from the windows-test-build branch. Not a release."
          fi
          gh release upload windows-test "$EXE" --clobber
          echo "uploaded: $EXE" >> "$GITHUB_STEP_SUMMARY"
