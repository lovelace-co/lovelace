types:
  - name: epic
    id_prefix: E
  - name: task
    id_prefix: T
  - name: bug
    id_prefix: T

statuses:
  - name: backlog
  - name: todo
  - name: in_progress
    active: true
  - name: in_review
    active: true
  - name: staging
    active: true
  - name: done
    complete: true
  - name: cancelled
    complete: true

transitions:
  - from: backlog
    to: [todo, cancelled]
  - from: todo
    to: [in_progress, backlog, cancelled]
  - from: in_progress
    to: [in_review, todo, cancelled]
  - from: in_review
    to: [staging, in_progress, cancelled]
  - from: staging
    to: [done, in_review]

priorities: [urgent, high, medium, low]

fields:
  - name: title
    type: string
    required: true
  - name: parent
    type: reference
    refers_to: [epic]
  - name: depends_on
    type: list
    item_type: reference
  - name: assignee
    type: reference
    refers_to: [actor]
  - name: priority
    type: enum
    values_from: priorities
  - name: estimate
    type: number
    applies_to: [task]
  - name: environment
    type: enum
    values: [local, dev, staging, production]
    applies_to: [bug]
    required: true

on_transition:
  - when: { to: staging, type: task }
    agent: Deploy the current branch to the staging environment using scripts/deploy-staging.sh and comment the result on the ticket.
    confirm: true
  - when: { to: done }
    run: ./scripts/archive-artifacts.sh
