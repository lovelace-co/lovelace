types:
  - name: epic
    id_prefix: E
    fields:
      - name: title
        type: string
        required: true
      - name: assignee
        type: reference
        refers_to: [actor]
      - name: priority
        type: enum
        values_from: priorities
  - name: task
    id_prefix: T
    fields:
      - name: title
        type: string
        required: true
      - name: parent
        type: reference
        refers_to: [epic]
      - name: depends_on
        type: list
        item_type: reference
      - name: assignee
        type: reference
        refers_to: [actor]
      - name: priority
        type: enum
        values_from: priorities
      - name: estimate
        type: number
  - name: bug
    id_prefix: T
    fields:
      - name: title
        type: string
        required: true
      - name: parent
        type: reference
        refers_to: [epic]
      - name: depends_on
        type: list
        item_type: reference
      - name: assignee
        type: reference
        refers_to: [actor]
      - name: priority
        type: enum
        values_from: priorities
      - name: environment
        type: enum
        values: [local, dev, staging, production]
        required: true

statuses:
  - name: backlog
  - name: todo
    agent: ready
  - name: in_progress
    agent: in_progress
  - name: in_review
  - name: done
    agent: complete
  - name: cancelled

priorities: [urgent, high, medium, low]
